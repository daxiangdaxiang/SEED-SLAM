name: DRANPPR Experimental Release
on:
  push:
    tags:
      - 'v0.1.0-dranppr.*'
permissions:
  contents: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9'
      - name: Install pinned research dependencies
        run: python3 -m pip install -r releases/dranppr-requirements.txt
      - name: Verify source snapshot
        working-directory: submodules/DRANPPR
        run: sha256sum -c SOURCE_SHA256SUMS
      - name: Test packaging and algorithm
        run: |
          python3 -m pytest -q tests/test_snapshot_dranppr.py
          bash scripts/test_dranppr_python.sh
      - name: Reproduce and independently audit 140 runs
        run: bash scripts/reproduce_dranppr.sh
      - name: Package evidence
        run: |
          tar -C submodules/DRANPPR -czf "$RUNNER_TEMP/dranppr-evidence.tar.gz" results/release
          cd "$RUNNER_TEMP"
          sha256sum dranppr-evidence.tar.gz > dranppr-evidence.sha256
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/dranppr-evidence.tar.gz" "$RUNNER_TEMP/dranppr-evidence.sha256" \
            --verify-tag --prerelease --latest=false \
            --title "DRANPPR Research Snapshot 1" \
            --notes-file "releases/$GITHUB_REF_NAME.md"
